name: sw_infra

services:
  pgadmin:
    image: dpage/pgadmin4:9.19.0
    container_name: pgadmin
    restart: unless-stopped

    environment:
      TZ: ${TZ:-UTC}
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      PGADMIN_DISABLE_POSTFIX: "true"

    volumes:
      - sw_infra_pgadmin_data:/var/lib/pgadmin
      - ./servers.json:/pgadmin4/servers.json:ro

    networks:
      - sw_infra_net

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.rule=Host(`${PGADMIN_DOMAIN}`)"
      - "traefik.http.routers.pgadmin.entrypoints=web"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://localhost:80/misc/ping || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    mem_limit: 512m

volumes:
  sw_infra_pgadmin_data:
    name: sw_infra_pgadmin_data

networks:
  sw_infra_net:
    external: true
    name: ${NETWORK_NAME:-sw_infra_net}
